# ginna: systemd-timesyncd's compiled-in server (ntp.ubuntu.com) resolves to
# IPv6-only addresses on this device's usual networks, so every NTP request
# times out and the clock never syncs. The PMIC RTC is not battery-backed, so
# each boot the clock starts at the epoch and systemd only bumps it to the
# build-date floor - it then free-runs an hour-plus off. Point timesyncd at
# pools that answer over IPv4 so it can actually sync once the network is up.
[Time]
NTP=pool.ntp.org
FallbackNTP=time.cloudflare.com time.google.com time.windows.com
