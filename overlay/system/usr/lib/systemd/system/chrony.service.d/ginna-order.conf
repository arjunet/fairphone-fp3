# ginna: don't try to start chrony.service (User=_chrony) before device-hacks
# has run systemd-sysusers to create that user - see
# overlay/system/usr/libexec/lxc-android-config/device-hacks. Upholds= (in
# multi-user.target.d/ginna-chrony.conf) would eventually converge anyway via
# its own restart-on-failure, but this avoids the failed first attempt.
[Unit]
After=device-hacks.service
