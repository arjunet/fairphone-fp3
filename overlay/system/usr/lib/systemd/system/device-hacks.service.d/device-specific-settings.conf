# ginna: device-hacks backgrounds halium-hal-recover (`... &`) to fix the
# graphics composer post-boot without blocking container bring-up. With the
# stock KillMode=control-group, systemd kills every process left in this
# oneshot unit's cgroup the moment device-hacks' own /bin/sh exits
# (Type=oneshot + RemainAfterExit=no => immediate deactivation) - including
# that backgrounded job, usually before it logs anything. KillMode=process
# only signals the unit's main process on stop, leaving background children
# alone so halium-hal-recover actually gets to run to completion.
[Service]
KillMode=process
