# ginna: chrony.deb is unpacked straight into the rootfs at build time
# (rootfs-overrides/armhf/*.deb, plain dpkg-deb -x, no maintainer scripts), so
# nothing ever runs its postinst's deb-systemd-helper enable chrony.service.
# Upholds= is systemd's own "make sure this is running" primitive: as long as
# multi-user.target is active, systemd starts chrony.service and restarts it
# if it ever stops - equivalent to a normal enabled unit, without depending on
# a *.target.wants/ symlink (those silently don't take effect for units added
# through this repo's overlay store).
[Unit]
Upholds=chrony.service
