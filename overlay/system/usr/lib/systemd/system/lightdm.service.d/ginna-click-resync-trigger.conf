# ginna: ginna-click-resync.service's own [Install] WantedBy=multi-user.target
# symlink never actually enables it - confirmed on-device 2026-09-14:
# `systemctl status` shows it `disabled`, and `journalctl -b` shows zero
# entries for it even after a full boot to a working desktop. Every time
# click-resync has actually run, it's been a manual invocation or a direct
# call from ginna-preinstall-clicks - never its own systemd trigger.
#
# Wants= (not Requires=/Before=) so this never blocks or delays lightdm
# itself - it just also starts ginna-click-resync.service whenever lightdm
# starts. ginna-click-resync.service's own After=lightdm.service (plus its
# ExecStartPre=sleep 20) still governs the actual ordering/delay, so it runs
# after lightdm exists, not blocking its startup.
[Unit]
Wants=ginna-click-resync.service
